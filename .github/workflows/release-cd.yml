name: Release CI/CD (OCI Multi-Stage Build & Publish)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional image tag override (defaults to git ref name)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  quality-and-security-gate:
    name: Full Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "VNstormgis-Frontend/package-lock.json"

      - name: Backend Spotless, Tests & JaCoCo Coverage
        working-directory: VNstormgis-Backend
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck test jacocoTestReport --no-daemon

      - name: Frontend Type-Check, Lint & Production Build
        working-directory: VNstormgis-Frontend
        run: |
          npm ci || npm install
          npm run type-check
          npm run lint
          npm run build

      - name: Static & Dependency Security Audit
        run: bash .github/scripts/security-audit-week6.sh --skip-docker-build

  build-and-publish-images:
    name: Build & Publish OCI Docker Images (GHCR)
    needs: quality-and-security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image Tags
        id: meta
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          SAFE_TAG="$(echo "$RAW_TAG" | tr '[:upper:]/' '[:lower:]-')"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_repo=ghcr.io/${OWNER_LC}/vnstormgis-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=ghcr.io/${OWNER_LC}/vnstormgis-web" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (and Push on Release Tag) Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: VNstormgis-Deployment/docker/backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.meta.outputs.backend_repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_repo }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build (and Push on Release Tag) Frontend Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: VNstormgis-Deployment/docker/frontend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.meta.outputs.frontend_repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_repo }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
