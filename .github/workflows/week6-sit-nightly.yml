name: Week 6 SIT, 500-CCU load & security nightly

on:
  # 03:00 UTC = 10:00 Vietnam time (UTC+7), 20 minutes after Week 5 nightly.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      failure_probe:
        description: "Controlled G-02 failure to verify notification and artifact retention"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: week6-sit-load-security
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/w6-07
      BACKEND_BASE_URL: http://127.0.0.1:8080
      WAIT_TIMEOUT_SECONDS: "180"
      W6_FORCE_FAILURE_GATE: ${{ inputs.failure_probe && 'G02' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare evidence directory
        run: mkdir -p "$ARTIFACT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: VNstormgis-Frontend/package-lock.json
      - name: Install frontend dependencies and JSON CLI
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          (cd VNstormgis-Frontend && npm ci)
      - name: Create job-owned PostGIS and Redis stack
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/w6-07-compose.env"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf 'DB_NAME=w6_07_ci\nDB_USERNAME=w6_07_ci\nDB_PASSWORD=%s\nDB_PORT=5432\nREDIS_PORT=6379\nREDIS_MAXMEMORY=256mb\nREDIS_MAXMEMORY_POLICY=volatile-lru\n' "$password" > "$env_file"
          chmod 600 "$env_file"
          printf 'DB_NAME=w6_07_ci\nDB_USERNAME=w6_07_ci\nDB_PASSWORD=%s\nDB_HOST=127.0.0.1\nREDIS_HOST=127.0.0.1\n' "$password" >> "$GITHUB_ENV"
          echo "W6_COMPOSE_ENV=$env_file" >> "$GITHUB_ENV"
          docker compose --env-file "$env_file" -f VNstormgis-Deployment/docker-compose.yml up -d
          for attempt in {1..45}; do
            db="$(docker inspect --format '{{.State.Health.Status}}' weathergis-postgres 2>/dev/null || true)"
            redis="$(docker inspect --format '{{.State.Health.Status}}' weathergis-redis 2>/dev/null || true)"
            if [[ "$db" == healthy && "$redis" == healthy ]]; then exit 0; fi
            sleep 2
          done
          echo 'PostGIS/Redis health timeout' >&2
          exit 1
      - name: Build smoke backend
        working-directory: VNstormgis-Backend
        run: timeout 15m ./gradlew bootJar -x test --no-daemon > "$ARTIFACT_DIR/bootstrap-gradle.log" 2>&1
      - name: Launch smoke backend without external sync or Gemini
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          unset GEMINI_API_KEY OPENWEATHERMAP_API_KEY
          export GEMINI_ENABLED=false
          export CHAT_RATELIMIT_TRUSTED_PROXIES=127.0.0.1
          boot_jar="$(find VNstormgis-Backend/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$boot_jar"
          java -jar "$boot_jar" \
            --spring.profiles.active=dev \
            --weathergis.sync.enabled=false \
            --weathergis.alert.retry.enabled=false \
            --weathergis.chat.session.cleanup.enabled=false \
            --logging.level.org.hibernate.SQL=WARN \
            --logging.level.vn.weathergis=INFO \
            > "$ARTIFACT_DIR/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/w6-07-backend.pid"
      - name: Verify Week 6 SIT, 500-CCU load & security pipeline
        shell: bash
        run: timeout --signal=TERM --kill-after=30s 65m bash .github/scripts/verify-week6-pipeline.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-07-${{ github.run_id }}
          path: |
            artifacts/w6-07/
            VNstormgis-Backend/build/test-results/test/
            VNstormgis-Backend/build/reports/tests/test/
            VNstormgis-Backend/build/reports/jacoco/test/
          retention-days: 30
          if-no-files-found: warn
      - name: Notify QA/DevOps of failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.W6_FAILURE_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo 'W6_FAILURE_WEBHOOK_URL is unset; QA/DevOps notification is not configured' >&2
            exit 1
          fi
          if [[ "$WEBHOOK_URL" != https://* ]]; then
            echo 'W6_FAILURE_WEBHOOK_URL must use HTTPS' >&2
            exit 1
          fi
          gate="$(jq -r '.gate // "pre-script"' "$ARTIFACT_DIR/summary.json" 2>/dev/null || echo pre-script)"
          jq -n --arg run "$RUN_URL" --arg sha "$RUN_SHA" --arg gate "$gate" \
            '{text:("W6-07 SIT/Load/Security nightly failed: " + $run + " SHA=" + $sha + " gate=" + $gate + " artifacts=" + $run + "#artifacts")}' \
            > "$RUNNER_TEMP/w6-07-notification.json"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/w6-07-notification.json" \
            "$WEBHOOK_URL" > /dev/null
      - name: Stop job-owned backend and stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/w6-07-backend.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/w6-07-backend.pid")" 2>/dev/null || true
          fi
          if [[ -n "${W6_COMPOSE_ENV:-}" && -f "$W6_COMPOSE_ENV" ]]; then
            timeout 60 docker compose --env-file "$W6_COMPOSE_ENV" -f VNstormgis-Deployment/docker-compose.yml down -v || true
            rm -f "$W6_COMPOSE_ENV"
          fi
