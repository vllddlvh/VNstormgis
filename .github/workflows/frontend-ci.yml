name: Frontend CI

on:
  push:
    branches: [main, staging]
    paths:
      - "VNstormgis-Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "VNstormgis-Frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "VNstormgis-Frontend/package-lock.json"

      - name: Install dependencies, type-check, lint & build
        working-directory: VNstormgis-Frontend
        run: |
          npm ci || npm install
          npm run type-check
          npm run lint
          npm run build
