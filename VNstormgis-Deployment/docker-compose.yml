version: "3.8"

services:
  # =======================================================
  # 1. SPATIAL DATABASE: PostgreSQL 16 + PostGIS 3.4
  # =======================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: weathergis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-weather_gis_db}
      POSTGRES_USER: ${DB_USERNAME:-gis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gis_password_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - weathergis-internal-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-gis_user} -d ${DB_NAME:-weather_gis_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =======================================================
  # 2. DISTRIBUTED CACHE: Redis 7.2
  # =======================================================
  redis:
    image: redis:7.2-alpine
    container_name: weathergis-redis
    restart: unless-stopped
    command: >
      redis-server 
      --maxmemory ${REDIS_MAXMEMORY:-256mb} 
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru} 
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - weathergis-internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # =======================================================
  # 2B. LOCAL SMTP & EMAIL WEB INBOX: Mailpit (Port 1025 / 8025)
  # =======================================================
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: weathergis-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - weathergis-internal-net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # =======================================================
  # 3. BACKEND CORE: Spring Boot Modular Monolith (Java 21)
  # =======================================================
  backend:
    profiles: ["fullstack"]
    build:
      context: ..
      dockerfile: VNstormgis-Deployment/docker/backend/Dockerfile
    container_name: weathergis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-weather_gis_db}
      DB_USERNAME: ${DB_USERNAME:-gis_user}
      DB_PASSWORD: ${DB_PASSWORD:-gis_password_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-true}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-change_me_local_dev_secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_admin_api_key}
      CHAT_RATELIMIT_TRUSTED_PROXIES: ${CHAT_RATELIMIT_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,127.0.0.1}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT_INTERNAL:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@weathergis.vn}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - weathergis-internal-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health/liveness || curl -fsS http://127.0.0.1:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =======================================================
  # 4. FRONTEND & REVERSE PROXY: React 18 SPA + Nginx 1.26
  # =======================================================
  web:
    profiles: ["fullstack"]
    build:
      context: ..
      dockerfile: VNstormgis-Deployment/docker/frontend/Dockerfile
    container_name: weathergis-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - weathergis-internal-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  postgis_data:
    name: weathergis_postgis_data
    driver: local
  redis_data:
    name: weathergis_redis_data
    driver: local

networks:
  weathergis-internal-net:
    name: weathergis-internal-net
    driver: bridge
