spring:
  application:
    name: weather-gis-backend

  # Kích hoạt công nghệ Virtual Threads của Java 21 (Project Loom)
  threads:
    virtual:
      enabled: true

  # Cấu hình Jackson JSON Serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

  # Cấu hình Hibernate JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Không tự động sửa bảng; toàn bộ DDL do Flyway quản lý
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  # Tạm thời tắt tự động kích hoạt Flyway ở profile mặc định; kích hoạt ở profile dev (W1-09)
  flyway:
    enabled: false

server:
  port: 8080
  shutdown: graceful

weathergis:
  admin:
    api-key: ${ADMIN_API_KEY:}
  alert:
    retry:
      enabled: ${ALERT_RETRY_ENABLED:true}
      fixed-delay-ms: ${ALERT_RETRY_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${ALERT_RETRY_INITIAL_DELAY_MS:5000}
      base-backoff-ms: ${ALERT_RETRY_BASE_BACKOFF_MS:5000}
      max-backoff-ms: ${ALERT_RETRY_MAX_BACKOFF_MS:300000}
      batch-size: ${ALERT_RETRY_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
