spring:
  application:
    name: weather-gis-backend

  # Kích hoạt công nghệ Virtual Threads của Java 21 (Project Loom)
  threads:
    virtual:
      enabled: true

  # Cấu hình Jackson JSON Serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

  # Cấu hình Hibernate JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Không tự động sửa bảng; toàn bộ DDL do Flyway quản lý
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  # Tạm thời tắt tự động kích hoạt Flyway ở profile mặc định; kích hoạt ở profile dev (W1-09)
  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:500ms}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: ${MAIL_SMTP_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

server:
  port: 8080
  shutdown: graceful

weathergis:
  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
  admin:
    api-key: ${ADMIN_API_KEY:}
  alert:
    retry:
      enabled: ${ALERT_RETRY_ENABLED:true}
      fixed-delay-ms: ${ALERT_RETRY_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${ALERT_RETRY_INITIAL_DELAY_MS:5000}
      base-backoff-ms: ${ALERT_RETRY_BASE_BACKOFF_MS:5000}
      max-backoff-ms: ${ALERT_RETRY_MAX_BACKOFF_MS:300000}
      batch-size: ${ALERT_RETRY_BATCH_SIZE:50}
  chat:
    ratelimit:
      session-limit: ${CHAT_RATELIMIT_SESSION_LIMIT:10}
      ip-limit: ${CHAT_RATELIMIT_IP_LIMIT:30}
      window: ${CHAT_RATELIMIT_WINDOW:60s}
      trusted-proxies: ${CHAT_RATELIMIT_TRUSTED_PROXIES:}
    session:
      retention: ${CHAT_SESSION_RETENTION:30d}
      cleanup:
        enabled: ${CHAT_CLEANUP_ENABLED:true}
        cron: ${CHAT_CLEANUP_CRON:0 0 3 * * *}
    reply:
      max-output-tokens: ${CHAT_REPLY_MAX_OUTPUT_TOKENS:1024}
      reply-max-chars: ${CHAT_REPLY_MAX_CHARS:4000}
      snapshot-cut-top-n: ${CHAT_REPLY_SNAPSHOT_CUT_TOP_N:5}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@weathergis.vn}
    from-name: ${MAIL_FROM_NAME:VNstormgis Cảnh Báo Khí Tượng}
    public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
    public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
    otp-ttl-minutes: ${MAIL_OTP_TTL_MINUTES:15}
    rate-limit-max-sends: ${MAIL_RATE_LIMIT_MAX_SENDS:5}
    rate-limit-window-minutes: ${MAIL_RATE_LIMIT_WINDOW_MINUTES:10}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
