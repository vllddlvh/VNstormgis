plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'vn.weathergis'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. Spring Boot Core Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 2. Database & Spatial Persistence
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.hibernate.orm:hibernate-spatial:6.5.3.Final'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // 3. GeoJSON Serialization for JTS (RSK-W1-02 Mitigation)
    implementation 'org.n52.jackson:jackson-datatype-jts:1.2.10'

    // 4. Database Migration (Flyway)
    implementation 'org.flywaydb:flyway-core:10.15.2'
    implementation 'org.flywaydb:flyway-database-postgresql:10.15.2'

    // 5. API Documentation (SpringDoc OpenAPI 3)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // 6. Distributed Cache — Redis 7.2 qua Lettuce (Task W3-03)
    //    Lettuce là driver mặc định của Spring Boot 3.3.4 BOM — KHÔNG khai báo phiên bản.
    //    KHÔNG thêm spring-boot-starter-cache / @EnableCaching: tầng cache là programmatic
    //    (quyết định #2/#14) — RedisCacheManager dùng trực tiếp qua GeoJsonCacheService.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 7. Developer Productivity Tools
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // 8. Testing & Integration Test Suite
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }

    // Auto-detect Docker Desktop socket on macOS if standard socket is absent
    def userHome = System.getProperty("user.home")
    def macDockerSock = new File("${userHome}/.docker/run/docker.sock")
    if (macDockerSock.exists() && !System.getenv("DOCKER_HOST")) {
        environment "DOCKER_HOST", "unix://${macDockerSock.absolutePath}"
    }
    environment "DOCKER_API_VERSION", "1.44"
    systemProperty "docker.api.version", "1.44"
    systemProperty "api.version", "1.44"
}
